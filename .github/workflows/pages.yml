name: Deploy homepage
on:
  push:
    branches: [main]
    paths: ["site/**", "tools/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  # Two jobs (GitHub's standard Pages setup): "build" uploads the site, then "deploy"
  # publishes it. Running them in one job sometimes failed with
  # "No artifacts named github-pages were found" because the upload wasn't visible yet.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # Checks every card list and builds the pages + offline cache.
      # If anything is wrong this step fails, nothing deploys, and the
      # live site stays on its last good version. Open the failed run to
      # see which file and card to fix.
      - name: Check content and build
        run: python3 tools/build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
