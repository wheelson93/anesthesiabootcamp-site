<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Practice-Defining Papers · Anesthesia Bootcamp</title>
<meta name="description" content="Landmark critical care papers rounded up by Kenji Tanabe, with free full text and the one-line takeaway.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%2314201d'/><path d='M4 22h5l2-12h9l2 12h6' fill='none' stroke='%23e8c547' stroke-width='3' stroke-linejoin='round'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f5f3ee;
    --card: #fffefb;
    --ink: #14201d;
    --muted: #5d6764;
    --line: #dcd8cf;
    --accent: #0e6b5c;
    --accent-soft: #e2efe9;
    --trace: #c99a12;
    --serif: "Newsreader", Georgia, serif;
    --sans: "IBM Plex Sans", system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, monospace;
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #0f1514;
      --card: #161e1c;
      --ink: #e7ece9;
      --muted: #97a39f;
      --line: #27322f;
      --accent: #5cc3a8;
      --accent-soft: #1b2d28;
      --trace: #e8c547;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font: 400 16px/1.55 var(--sans);
  }
  a { color: inherit; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 20px; }

  /* ---------- Header ---------- */
  header.site { padding: 28px 0 0; }
  .brand {
    display: flex; align-items: center; gap: 10px;
    font: 500 12px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase;
    color: var(--muted); text-decoration: none;
  }
  .brand svg { width: 26px; height: 26px; flex: none; }

  .hero { padding: 56px 0 28px; }
  .hero h1 {
    font: 600 clamp(2.3rem, 6vw, 3.9rem)/1.04 var(--serif);
    letter-spacing: -.015em;
    margin: 0 0 16px;
    max-width: 14ch;
    text-wrap: balance;
  }
  .hero p {
    margin: 0; max-width: 54ch; color: var(--muted);
    font-size: 1.075rem; text-wrap: pretty;
  }

  .related { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
  .related a {
    display: inline-flex; align-items: center; gap: 6px; text-decoration: none;
    font: 500 14px/1 var(--sans); padding: 9px 14px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--card); color: var(--ink);
    transition: border-color .15s;
  }
  .related a:hover { border-color: var(--accent); }
  .related a .k { font: 500 11px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }

  /* Capnography trace motif */
  .trace { display: block; width: 100%; height: 64px; margin: 34px 0 0; overflow: visible; }
  .trace path {
    fill: none; stroke: var(--trace); stroke-width: 2.25;
    stroke-linejoin: round; stroke-linecap: round;
    stroke-dasharray: 2600; stroke-dashoffset: 2600;
    animation: draw 2.6s cubic-bezier(.3,.6,.2,1) .15s forwards;
  }
  .trace line { stroke: var(--line); stroke-width: 1; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @media (prefers-reduced-motion: reduce) { .trace path { animation: none; stroke-dashoffset: 0; } }

  /* ---------- Controls ---------- */
  .controls {
    position: sticky; top: 0; z-index: 5;
    background: color-mix(in srgb, var(--paper) 92%, transparent);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    padding: 14px 0; border-bottom: 1px solid var(--line);
  }
  .controls .wrap { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; }
  .search {
    position: relative; flex: 1 1 260px; max-width: 380px;
  }
  .search input {
    width: 100%; height: 42px; padding: 0 40px 0 38px;
    border: 1px solid var(--line); border-radius: 999px;
    background: var(--card); color: var(--ink);
    font: 400 15px var(--sans);
  }
  .search input:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }
  .search svg { position: absolute; left: 13px; top: 12px; width: 18px; height: 18px; color: var(--muted); }
  .search kbd {
    position: absolute; right: 12px; top: 10px;
    font: 500 11px/20px var(--mono); padding: 0 6px; border-radius: 5px;
    border: 1px solid var(--line); color: var(--muted);
  }
  @media (hover: none) { .search kbd { display: none; } }

  .chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; flex: 1 1 auto; padding: 2px 0; }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: none; height: 34px; padding: 0 14px; border-radius: 999px;
    border: 1px solid var(--line); background: transparent; color: var(--ink);
    font: 500 13.5px var(--sans); cursor: pointer; white-space: nowrap;
    transition: background-color .15s, border-color .15s, color .15s;
  }
  .chip:hover { border-color: var(--muted); }
  .chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .chip .n { font-family: var(--mono); font-size: 11px; opacity: .6; margin-left: 5px; }

  /* ---------- Sections & cards ---------- */
  main { padding: 34px 0 72px; }
  .section-label {
    font: 500 12px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase;
    color: var(--muted); margin: 0 0 14px; display: flex; align-items: center; gap: 12px;
  }
  .section-label::after { content: ""; height: 1px; background: var(--line); flex: 1; }
  .section + .section { margin-top: 42px; }

  .grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); }
  .card {
    display: flex; flex-direction: column; gap: 10px;
    padding: 20px 20px 18px; min-height: 172px;
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    text-decoration: none; position: relative;
    transition: border-color .18s, transform .18s cubic-bezier(.2,.7,.3,1), box-shadow .18s;
  }
  .card:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: 0 10px 24px -18px rgba(0,0,0,.45); }
  .card:focus-within { outline: 2px solid var(--accent); outline-offset: 3px; }
  .card a.main { text-decoration: none; }
  .card a.main:focus { outline: none; }
  .card a.main::after { content: ""; position: absolute; inset: 0; border-radius: var(--radius); }
  .card a.extra {
    position: relative; z-index: 1;
    font: 600 11.5px/1 var(--sans); padding: 5px 9px; border-radius: 6px;
    background: var(--accent-soft); color: var(--accent); text-decoration: none;
    border: 1px solid transparent;
  }
  .card a.extra:hover { border-color: var(--accent); }
  .card .top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .card .icon {
    width: 40px; height: 40px; border-radius: 10px; background: var(--accent-soft);
    display: grid; place-items: center; font-size: 21px; line-height: 1;
  }
  .card .meta { font: 500 11px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); text-align: right; }
  .card .badge { color: var(--accent); }
  .card h3 { margin: 4px 0 0; font: 600 1.28rem/1.2 var(--serif); letter-spacing: -.005em; text-wrap: balance; }
  .card p { margin: 0; color: var(--muted); font-size: .95rem; text-wrap: pretty; }
  .card p.why { color: var(--ink); font-size: .92rem; }
  .card p.why b { display: block; font: 500 11px/1.6 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }
  .card .foot { margin-top: auto; padding-top: 6px; display: flex; gap: 6px; flex-wrap: wrap; }
  .tag { font: 500 11.5px/1 var(--sans); padding: 5px 8px; border-radius: 6px; background: var(--paper); color: var(--muted); border: 1px solid var(--line); }

  .featured .grid { grid-template-columns: repeat(auto-fill, minmax(min(100%, 420px), 1fr)); }
  .featured .card { min-height: 190px; border-color: color-mix(in srgb, var(--accent) 35%, var(--line)); }
  .featured .card h3 { font-size: 1.55rem; }

  .empty { padding: 48px 0; text-align: center; color: var(--muted); }
  .empty button { margin-top: 12px; }

  footer.site { border-top: 1px solid var(--line); padding: 26px 0 40px; color: var(--muted); font-size: .9rem; }
  footer.site .wrap { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; }
  .disclaimer { max-width: 62ch; }
</style>
</head>
<body>

<header class="site">
  <div class="wrap">
    <a class="brand" href="/" id="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="currentColor" opacity=".12"/><path d="M4 22h5l2-12h9l2 12h6" fill="none" stroke="var(--trace)" stroke-width="2.6" stroke-linejoin="round"/></svg>
      <span id="site-name">Anesthesia Bootcamp</span>
    </a>
    <section class="hero">
      <h1 id="hero-title">Practice-defining papers.</h1>
      <p id="hero-lead">Quick references, interactive tools and walkthroughs for residents, students and anyone learning anesthesia.</p>
      <nav class="related" id="related" aria-label="More teaching" hidden></nav>
      <svg class="trace" viewBox="0 0 1040 64" preserveAspectRatio="none" aria-hidden="true">
        <line x1="0" y1="56" x2="1040" y2="56"/>
        <path d="M0 56 H40 C46 56 48 14 58 12 L150 8 C156 8 158 56 166 56 H230 C236 56 238 14 248 12 L340 8 C346 8 348 56 356 56 H420 C426 56 428 14 438 12 L530 8 C536 8 538 56 546 56 H610 C616 56 618 14 628 12 L720 8 C726 8 728 56 736 56 H800 C806 56 808 14 818 12 L910 8 C916 8 918 56 926 56 H1040"/>
      </svg>
    </section>
  </div>
</header>

<div class="controls" role="search">
  <div class="wrap">
    <label class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search pages" aria-label="Search pages" autocomplete="off">
      <kbd>/</kbd>
    </label>
    <div class="chips" id="chips" aria-label="Filter by topic"></div>
  </div>
</div>

<main>
  <div class="wrap" id="content" aria-live="polite"></div>
</main>

<footer class="site">
  <div class="wrap">
    <span>© <span id="year"></span> Anesthesia Bootcamp</span>
    <span class="disclaimer">For education only. Not a substitute for clinical judgment, institutional protocols or current prescribing information.</span>
  </div>
</footer>

<script>
(() => {
  const NEW_DAYS = 21;
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  $("#year").textContent = new Date().getFullYear();

  let pages = [], cat = "All", query = "";

  const isNew = (p) => p.updated && (Date.now() - new Date(p.updated + "T12:00:00")) / 864e5 <= NEW_DAYS;
  const fmtDate = (d) => d ? new Date(d + "T12:00:00").toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" }) : "";

  function card(p) {
    const meta = p.source ? esc(p.source) : (isNew(p) ? `<span class="badge">New</span> · ${esc(fmtDate(p.updated))}` : esc(fmtDate(p.updated)));
    const tags = (p.tags || []).map((t) => `<span class="tag">${esc(t)}</span>`).join("");
    const links = (p.links || []).filter((l) => !l.private).map((l) =>
      `<a class="extra" href="${esc(l.url)}">${esc(l.label)} <span aria-hidden="true">↗</span></a>`).join("");
    return `<article class="card">
      <div class="top"><span class="icon" aria-hidden="true">${esc(p.emoji || "📄")}</span><span class="meta">${meta}</span></div>
      <h3><a class="main" href="${esc(p.url)}">${esc(p.title)}</a></h3>
      ${p.blurb ? `<p>${esc(p.blurb)}</p>` : ""}
      ${p.why ? `<p class="why"><b>Why it matters</b> ${esc(p.why)}</p>` : ""}
      <div class="foot">${links}<span class="tag">${esc(p.category || "Other")}</span>${tags}</div>
    </article>`;
  }

  function matches(p) {
    if (cat !== "All" && (p.category || "Other") !== cat) return false;
    if (!query) return true;
    const hay = [p.title, p.blurb, p.why, p.source, p.category, ...(p.tags || [])].join(" ").toLowerCase();
    return query.split(/\s+/).every((w) => hay.includes(w));
  }

  function renderChips() {
    const counts = {};
    pages.forEach((p) => { const c = p.category || "Other"; counts[c] = (counts[c] || 0) + 1; });
    const cats = ["All", ...Object.keys(counts).sort()];
    $("#chips").innerHTML = cats.map((c) =>
      `<button class="chip" type="button" data-cat="${esc(c)}" aria-pressed="${c === cat}">${esc(c)}<span class="n">${c === "All" ? pages.length : counts[c]}</span></button>`
    ).join("");
  }

  function render() {
    const shown = pages.filter(matches);
    const el = $("#content");
    if (!shown.length) {
      el.innerHTML = `<div class="empty">${pages.length ? "Nothing matches that search." : "No pages yet."}${pages.length ? '<br><button class="chip" type="button" id="reset">Clear filters</button>' : ""}</div>`;
      $("#reset")?.addEventListener("click", () => { cat = "All"; query = ""; $("#q").value = ""; renderChips(); render(); });
      return;
    }
    const browsing = cat === "All" && !query;
    const featured = browsing ? shown.filter((p) => p.featured) : [];
    const rest = shown.filter((p) => !featured.includes(p));
    let html = "";
    if (featured.length) html += `<section class="section featured"><h2 class="section-label">Start here</h2><div class="grid">${featured.map(card).join("")}</div></section>`;
    if (browsing) {
      const groups = {};
      rest.forEach((p) => (groups[p.category || "Other"] ||= []).push(p));
      for (const g of Object.keys(groups).sort())
        html += `<section class="section"><h2 class="section-label">${esc(g)}</h2><div class="grid">${groups[g].map(card).join("")}</div></section>`;
    } else {
      html += `<section class="section"><h2 class="section-label">${shown.length} page${shown.length === 1 ? "" : "s"}</h2><div class="grid">${rest.map(card).join("")}</div></section>`;
    }
    el.innerHTML = html;
  }

  $("#chips").addEventListener("click", (e) => {
    const b = e.target.closest(".chip"); if (!b) return;
    cat = b.dataset.cat; renderChips(); render();
  });
  $("#q").addEventListener("input", (e) => { query = e.target.value.trim().toLowerCase(); render(); });
  document.addEventListener("keydown", (e) => {
    if (e.key === "/" && document.activeElement !== $("#q")) { e.preventDefault(); $("#q").focus(); }
    if (e.key === "Escape" && document.activeElement === $("#q")) { $("#q").value = ""; query = ""; render(); $("#q").blur(); }
  });

  fetch("pages.json", { cache: "no-cache" })
    .then((r) => r.json())
    .then((data) => {
      if (data.site) {
        if (data.site.title) { $("#hero-title").textContent = data.site.title; }
        if (data.site.lead) { $("#hero-lead").textContent = data.site.lead; }
        if (data.site.brand) { $("#site-name").textContent = data.site.brand; }
        if (data.site.links && data.site.links.length) {
          const nav = $("#related");
          nav.innerHTML = data.site.links.map((l) =>
            `<a href="${esc(l.url)}">${l.kicker ? `<span class="k">${esc(l.kicker)}</span>` : ""}${esc(l.label)} <span aria-hidden="true">${/^https?:/.test(l.url) ? "↗" : "→"}</span></a>`).join("");
          nav.hidden = false;
        }
      }
      pages = (data.pages || []).filter((p) => !p.hidden)
        .sort((a, b) => (b.updated || "").localeCompare(a.updated || "") || a.title.localeCompare(b.title));
      renderChips(); render();
    })
    .catch(() => { $("#content").innerHTML = '<div class="empty">Couldn\'t load the page list.</div>'; });
})();
</script>
</body>
</html>
